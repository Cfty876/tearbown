name: BREAKPOINT macOS QA
on:
  workflow_dispatch:
  push:
    branches: [breakpoint-release]
    paths:
      - '.github/workflows/macos.yml'
      - 'game/**'
      - 'native/**'
      - 'build_macos.sh'
      - 'tools/stage_release.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the pinned C++ bindings
        run: |
          git init tools/godot-cpp
          git -C tools/godot-cpp fetch --depth=1 https://github.com/godotengine/godot-cpp.git cedbd9e71b24eb2898b28867c5faf6114da9e5e2
          git -C tools/godot-cpp checkout --detach FETCH_HEAD
      - name: Install the Godot 4.7.2 build tools
        run: |
          prefix=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/editor.zip" "$prefix/Godot_v4.7.2-stable_macos.universal.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/templates.tpz" "$prefix/Godot_v4.7.2-stable_export_templates.tpz"
          cd "$RUNNER_TEMP"
          printf '%s\n'             'c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  editor.zip'             'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz' | shasum -a 256 --check
          unzip -q editor.zip
          folder="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$folder"
          unzip -jo templates.tpz templates/macos.zip -d "$folder"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Build and run the universal application
        run: |
          bash build_macos.sh "$RUNNER_TEMP/breakpoint"
          "$RUNNER_TEMP/breakpoint/BREAKPOINT.app/Contents/MacOS/BREAKPOINT" \
            --headless --quit-after 450 --log-file "$RUNNER_TEMP/mac-smoke.log" -- --level=proto --windowed
          grep -F '[level] proto built' "$RUNNER_TEMP/mac-smoke.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/mac-smoke.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BREAKPOINT-macOS-QA
          path: |
            ${{ runner.temp }}/breakpoint/BREAKPOINT-macOS-test.zip
            ${{ runner.temp }}/mac-smoke.log
          if-no-files-found: ignore
          compression-level: 0
