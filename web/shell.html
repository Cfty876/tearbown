<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10171b">
  <title>Играть в BREAKPOINT</title>
  <link rel="icon" href="./index.png" type="image/png">
  <link rel="stylesheet" href="/play.css">
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="BREAKPOINT"></canvas>
  <button id="fullscreen" class="fullscreen-toggle" type="button" aria-pressed="false" hidden>На весь экран</button>
  <p id="fullscreen-status" class="fullscreen-status" role="status" hidden></p>
  <main id="loader" class="cover">
    <div class="card">
      <a href="/">← На сайт</a>
      <h1>BREAKPOINT</h1>
      <p class="browser-version">Браузерная версия __BREAKPOINT_BROWSER_VERSION__</p>
      <p>Запусти игру, чтобы открыть песочницу или сыграть в прятки по коду комнаты.</p>
      <button id="boot" type="button">Запустить игру</button>
      <progress id="progress" aria-label="Загрузка игры" hidden></progress>
      <p id="boot-status" role="status"></p>
    </div>
  </main>
  <script src="/release-config.js"></script>
  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.querySelector("#canvas");
    const loader = document.querySelector("#loader");
    const fullscreen = document.querySelector("#fullscreen");
    const fullscreenStatus = document.querySelector("#fullscreen-status");
    fullscreen.hidden = !document.fullscreenEnabled || !document.documentElement.requestFullscreen;
    document.addEventListener("fullscreenchange", () => {
      const active = Boolean(document.fullscreenElement);
      fullscreen.textContent = active ? "Выйти из полного экрана" : "На весь экран";
      fullscreen.setAttribute("aria-pressed", String(active));
    });
    fullscreen.addEventListener("click", async () => {
      fullscreenStatus.hidden = true;
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
        if (loader.hidden) canvas.focus();
      } catch (error) {
        console.warn("Fullscreen", error);
        fullscreenStatus.textContent = "Браузер не разрешил переключить полноэкранный режим.";
        fullscreenStatus.hidden = false;
      }
    });

    window.BreakpointAudio = {
      pick(limit, done) {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = ".mp3,.ogg,.wav";
        picker.hidden = true;
        document.body.append(picker);
        picker.addEventListener("cancel", () => {
          picker.remove();
          canvas.focus();
          done();
        }, { once: true });
        picker.addEventListener("change", async () => {
          const file = picker.files[0];
          picker.remove();
          canvas.focus();
          if (!file) return done();
          if (file.size > limit) return done("Выбери MP3, OGG или WAV размером до 20 МБ.");
          try {
            const data = await file.arrayBuffer();
            done(file.name, data);
          } catch {
            done("Не удалось открыть аудиофайл.");
          }
        }, { once: true });
        picker.click();
      }
    };

    const button = document.querySelector("#boot");
    const bar = document.querySelector("#progress");
    const status = document.querySelector("#boot-status");
    button.addEventListener("click", async () => {
      button.disabled = true;
      bar.hidden = false;
      status.textContent = "Загружаем игру…";
      try {
        const engine = new Engine($GODOT_CONFIG);

        await engine.startGame({
          canvas,
          onProgress(done, total) {
            if (total > 0) {
              bar.max = total;
              bar.value = done;
            }
          }
        });
        loader.hidden = true;
        canvas.focus();
      } catch (error) {
        console.error(error);
        bar.hidden = true;
        status.textContent = "Не удалось запустить игру. Обнови страницу или скачай версию для компьютера.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
