<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111817">
  <title>Воксельный снос</title>
  <link rel="icon" href="./index.png" type="image/png">
  <link rel="stylesheet" href="./game.css">
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Воксельный снос"></canvas>
  <aside id="rotate-hint" aria-hidden="true">Поверни телефон для удобной игры</aside>
  <main id="loader" class="cover">
    <section class="card">
      <p class="eyebrow">BREAKPOINT / WEB</p>
      <h1>Воксельный снос</h1>
      <p>Разрушаемый мир и прятки на двоих. На телефоне удобнее играть горизонтально.</p>
      <button id="boot" type="button">Открыть игру</button>
      <progress id="progress" hidden></progress>
      <p id="boot-status" role="status"></p>
    </section>
  </main>
  <dialog id="rooms" class="card">
    <p class="eyebrow">ЛОББИ / 2 ИГРОКА</p>
    <h2>Сетевые прятки</h2>
    <div id="room-actions">
      <button id="create-room" type="button">Создать комнату</button>
      <form id="join-room">
        <label for="room-code">Код друга</label>
        <input id="room-code" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="A1B2C3D4" required>
        <button type="submit">Войти</button>
      </form>
    </div>
    <div id="room-invite" hidden>
      <p>Передай этот код другу</p>
      <output id="room-share"></output>
      <button id="copy-room" type="button">Копировать ссылку</button>
    </div>
    <p id="room-status" role="status"></p>
    <button id="close-room" class="quiet" type="button">Назад</button>
  </dialog>
  <script src="./rooms.js"></script>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    const button = document.querySelector("#boot");
    const bar = document.querySelector("#progress");
    const status = document.querySelector("#boot-status");
    button.addEventListener("click", async () => {
      button.disabled = true;
      bar.hidden = false;
      status.textContent = "Загружаем воксельный движок…";
      if (!crossOriginIsolated) {
        status.textContent = "Для запуска открой игру по HTTPS с заголовками COOP/COEP или через локальный сервер.";
        button.disabled = false;
        return;
      }
      try {
        const engine = new Engine(config);
        await engine.startGame({
          canvas: document.querySelector("#canvas"),
          onProgress(done, total) {
            if (total > 0) {
              bar.max = total;
              bar.value = done;
            }
          }
        });
        document.querySelector("#loader").hidden = true;
        document.querySelector("#canvas").focus();
      } catch (error) {
        console.error(error);
        status.textContent = "Движок не запустился. " + (error?.message ?? String(error));
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
